# Tape share server: one Worker, one private R2 bucket, one small D1 table.
# Setup steps are in ../docs/sharing-plan.md ("Deploying").
name = "tape"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

# Served at https://zeroseat.ai/tape/... through the "apps" Worker (service binding),
# so share links look like https://zeroseat.ai/tape/recordings/<id>.
[vars]
BASE_PATH = "/tape"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tape-shares"

[[d1_databases]]
binding = "DB"
database_name = "tape"
# Replace with the id `npx wrangler d1 create tape` prints.
database_id = "00000000-0000-0000-0000-000000000000"

# Secret, set with `npx wrangler secret put UPLOAD_TOKEN` (and in .dev.vars
# for local development). Never put it in this file.

# The fallback link-preview card is bundled as binary data.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false
